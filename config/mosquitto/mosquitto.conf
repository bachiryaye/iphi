# Simulation-only broker, on an internal Compose network without a host listener.
listener 1883
max_connections 16
allow_anonymous true
persistence false
retain_available false
max_packet_size 66560
message_size_limit 65536
max_queued_messages 512
max_inflight_messages 20
memory_limit 16777216
log_dest stdout
log_type error
log_type warning
