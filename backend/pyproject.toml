[project]
name = "iphi"
version = "0.1.0"
description = "Industrial Platform Health Intelligence: observability and diagnostics for a simulated industrial data platform."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi>=0.162.5,<0.163",
    "psycopg[binary]>=3.3.9,<4",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.16.2,<3",
    "sqlalchemy>=2.1.8,<3",
    "structlog>=26.1.0,<27",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<3",
    "hypothesis>=6.170.15,<7",
    "import-linter>=2.16,<3",
    "mypy>=2.4.1,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.4,<0.18",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "DTZ", "T20", "SIM", "RUF", "PL", "N", "C4", "PT", "TID", "ERA"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the pytest idiom; fixtures use throwaway credentials against local test databases.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
# The local alembic/ directory holds migrations; the package itself is third-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic", "scripts"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL (IPHI_TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

# rules.md A-03: domain code stays free of I/O and framework imports.
[[tool.importlinter.contracts]]
name = "Domain modules are framework-free"
type = "forbidden"
source_modules = ["app.*.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "httpx", "psycopg", "alembic", "app.api"]
allow_indirect_imports = true

# rules.md A-02 / A-04: routers reach modules through services only.
[[tool.importlinter.contracts]]
name = "API layer does not touch repositories"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.*.repository"]
allow_indirect_imports = true
