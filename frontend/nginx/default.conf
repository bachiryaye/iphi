# Static build + same-origin reverse proxy to the API, so the API needs no CORS policy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;

    location /assets/ {
        include /etc/nginx/iphi/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # API responses keep the API's own security headers (stricter CSP for JSON).
    location ~ ^/(api/|health$|ready$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (US-07) needs unbuffered responses.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        include /etc/nginx/iphi/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
