name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iphi
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: iphi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iphi" --health-interval 2s --health-timeout 3s
          --health-retries 20
    env:
      IPHI_TEST_DATABASE_URL: postgresql+psycopg://iphi:ci-only@127.0.0.1:5432/postgres
      IPHI_DATABASE_URL: postgresql+psycopg://iphi:ci-only@127.0.0.1:5432/iphi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: PDF rendering libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Lint
        run: uv run ruff format --config pyproject.toml --check . ../scripts/init_env.py && uv run ruff check --config pyproject.toml . ../scripts/init_env.py
      - name: Import contracts
        run: uv run lint-imports
      - name: Type check
        run: uv run mypy && uv run mypy ../scripts/init_env.py
      - name: Migrations and seed apply on an ephemeral PostgreSQL
        run: uv run python -m app.bootstrap && uv run python -m app.bootstrap
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: Dependency audit
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  api-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --locked
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Generated client matches the backend OpenAPI
        run: make api-drift

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure disposable demo credentials
        run: make init-env
      - name: Frontend build context excludes credentials and browser artifacts
        run: |
          mkdir -p frontend/.playwright frontend/test-results
          printf 'not-a-credential\n' > frontend/.playwright/context-sentinel
          printf 'not-a-credential\n' > frontend/test-results/context-sentinel
          printf 'not-a-credential\n' > frontend/.env.context-probe
          printf 'FROM scratch\nCOPY . /context\n' > "$RUNNER_TEMP/context.Dockerfile"
          docker build -f "$RUNNER_TEMP/context.Dockerfile" \
            --output "type=local,dest=$RUNNER_TEMP/frontend-context" frontend
          test ! -e "$RUNNER_TEMP/frontend-context/context/.playwright"
          test ! -e "$RUNNER_TEMP/frontend-context/context/test-results"
          test ! -e "$RUNNER_TEMP/frontend-context/context/.env.context-probe"
          test -f "$RUNNER_TEMP/frontend-context/context/src/main.tsx"
      - name: Build the Compose images
        run: docker compose build
      - name: Stack starts and becomes ready
        run: |
          docker compose up -d
          make wait-ready READY_URL=http://127.0.0.1:8080 || {
            docker compose ps --all; docker compose logs; exit 1; }
      - name: Simulation is seeded and reachable through the frontend proxy
        run: |
          docker compose exec -T api python -c 'from scripts.client import Api; a = Api("http://127.0.0.1:8000"); assert any(s["key"] == "collector_down" for s in a.get("/simulations/scenarios")["items"]); assert any(r["scenario_key"] == "baseline" for r in a.get("/simulations/runs", status="active")["items"])'
      - name: Proxy follows a recreated API container
        run: |
          docker compose up -d --force-recreate --no-deps api
          make wait-ready READY_URL=http://127.0.0.1:8080 || {
            docker compose logs frontend api; exit 1; }
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Playwright browser cache
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: frontend
      - name: Scripted demonstration (make demo)
        run: make demo DEMO_ARGS=--no-live-incident
      - name: End-to-end tests (make test-e2e)
        run: make test-e2e
      - name: Optional AI diagnosis with the local fake provider
        run: |
          IPHI_LLM_PROVIDER=fake IPHI_FRONTEND_PORT=8081 IPHI_API_PORT=8001 IPHI_DB_PORT=5434 \
            docker compose -p iphi-demo up -d --no-deps --force-recreate api
          make wait-ready
          cd frontend && IPHI_E2E_URL=http://127.0.0.1:8081 IPHI_E2E_LLM=fake pnpm exec playwright test --project chromium --grep 'US-08'
      - name: MQTT simulation through the real broker
        run: |
          make demo-down
          IPHI_LLM_PROVIDER=none make mqtt-demo DEMO_ARGS=--no-live-incident
      - name: Existing dashboard on MQTT observations
        run: >-
          cd frontend && IPHI_E2E_URL=http://127.0.0.1:8082 IPHI_E2E_MQTT=1
          pnpm exec playwright test --project chromium --grep 'US-12'
      - name: Stack logs
        if: failure()
        run: |
          docker compose -p iphi-demo logs --tail 300
          docker compose -p iphi-mqtt -f compose.yaml -f compose.mqtt.yaml --profile mqtt logs --tail 100
      - name: Keep the Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: make demo-down mqtt-down

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
