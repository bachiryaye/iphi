name: iphi

# API and frontend ports bind to IPHI_BIND_HOST, 127.0.0.1 by default (rules.md X-12, ADR 0007).
# api, worker and migrate are entry points of one image (ADR 0001); only migrate builds it.
x-backend: &backend
  image: iphi-backend:local
  pull_policy: never
  environment: &backend-env
    IPHI_DATABASE_URL: postgresql+psycopg://${IPHI_DB_USER:-iphi}:${IPHI_DB_PASSWORD:-iphi_local_dev}@db:5432/${IPHI_DB_NAME:-iphi}
    IPHI_LOG_LEVEL: ${IPHI_LOG_LEVEL:-info}
    IPHI_LOG_FORMAT: ${IPHI_LOG_FORMAT:-json}
    IPHI_CYCLE_INTERVAL_S: ${IPHI_CYCLE_INTERVAL_S:-5}
    IPHI_LLM_PROVIDER: ${IPHI_LLM_PROVIDER:-none}
    IPHI_SIM_SEED: ${IPHI_SIM_SEED:-42}
    IPHI_RETENTION_DAYS: ${IPHI_RETENTION_DAYS:-7}
    IPHI_DEPLOYMENT_MODE: ${IPHI_DEPLOYMENT_MODE:-local}
    IPHI_BIND_HOST: ${IPHI_BIND_HOST:-127.0.0.1}
    IPHI_ALLOWED_HOSTS: ${IPHI_ALLOWED_HOSTS:-127.0.0.1,localhost}
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${IPHI_DB_USER:-iphi}
      # Local development default only; override it in .env (see .env.example).
      POSTGRES_PASSWORD: ${IPHI_DB_PASSWORD:-iphi_local_dev}
      POSTGRES_DB: ${IPHI_DB_NAME:-iphi}
    ports:
      # The database stays on loopback whatever IPHI_BIND_HOST says.
      - "127.0.0.1:${IPHI_DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    # Parallel workers use /dev/shm, 64 MB by default in a container.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 60s
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    build:
      context: ./backend
    command: ["migrate"]
    environment:
      <<: *backend-env
      IPHI_DEMO_VIEWER_PASSWORD: ${IPHI_DEMO_VIEWER_PASSWORD:-}
      IPHI_DEMO_ENGINEER_PASSWORD: ${IPHI_DEMO_ENGINEER_PASSWORD:-}
      IPHI_DEMO_ADMIN_PASSWORD: ${IPHI_DEMO_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *backend-env
      IPHI_DEMO_ADMIN_PASSWORD: ${IPHI_DEMO_ADMIN_PASSWORD:-}
      IPHI_LLM_MODEL: ${IPHI_LLM_MODEL:-}
      IPHI_LLM_API_KEY: ${IPHI_LLM_API_KEY:-}
      IPHI_LLM_REASONING_EFFORT: ${IPHI_LLM_REASONING_EFFORT:-default}
      IPHI_LLM_TIMEOUT_S: ${IPHI_LLM_TIMEOUT_S:-20}
      IPHI_LLM_INPUT_TOKENS: ${IPHI_LLM_INPUT_TOKENS:-8192}
      IPHI_LLM_OUTPUT_TOKENS: ${IPHI_LLM_OUTPUT_TOKENS:-1600}
    ports:
      - "${IPHI_BIND_HOST:-127.0.0.1}:${IPHI_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: iphi-frontend:local
    ports:
      - "${IPHI_BIND_HOST:-127.0.0.1}:${IPHI_FRONTEND_PORT:-8080}:8080"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
